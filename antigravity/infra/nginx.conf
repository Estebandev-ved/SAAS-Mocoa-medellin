# nginx corre en el host (no en Docker) y sirve los dos frontends ya
# compilados (`npm run build` -> dist/) directo desde disco; solo la API,
# el instance-manager y el socket corren en contenedores (ver
# docker-compose.yml). Esto evita tener que containerizar dos builds
# estáticos de Vite para una app de este tamaño.
#
# Dos dominios, dos apps distintas — no pueden compartir la misma raíz
# porque cada una define sus propias rutas /login, /register, /dashboard:
#   - antigravity.co        -> agency-platform-react (landing + dashboard real del negocio)
#   - panel.antigravity.co  -> agency-platform-react (mismo build: /admin, /delivery/*; antigravity/frontend ya no existe)
#
# Ajusta las rutas `root` de abajo a donde de verdad copies cada `dist/`
# en el servidor.

upstream api_backend {
    server localhost:3002;
}

# El servidor de Socket.io vive en api/index.js (puerto 3002), no en el
# instance-manager (3001, que solo tiene un *cliente* de socket.io —
# ver instance-manager/socketEmitter.js). El nginx.conf original apuntaba
# esto a 3001, lo cual habría dejado /socket.io/ sin conectar en producción.
upstream socket_backend {
    server localhost:3002;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ---------- antigravity.co (agency-platform-react) ----------

server {
    listen 80;
    server_name antigravity.co www.antigravity.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name antigravity.co www.antigravity.co;

    ssl_certificate /etc/letsencrypt/live/antigravity.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antigravity.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://socket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Service worker y manifest de la PWA: sin caché largo — si el navegador se queda con
    # un sw.js viejo, los usuarios no reciben nunca las versiones nuevas de la app.
    location = /sw.js {
        root /var/www/antigravity/agency-platform-react/dist;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        root /var/www/antigravity/agency-platform-react/dist;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/antigravity/agency-platform-react/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/antigravity_access.log;
    error_log /var/log/nginx/antigravity_error.log;
}

# ---------- panel.antigravity.co (agency-platform-react: admin, domiciliario, tracking) ----------

server {
    listen 80;
    server_name panel.antigravity.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name panel.antigravity.co;

    ssl_certificate /etc/letsencrypt/live/panel.antigravity.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.antigravity.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://socket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Service worker y manifest del portal del domiciliario: sin caché largo (ver nota arriba).
    location = /delivery-sw.js {
        root /var/www/antigravity/agency-platform-react/dist;
        add_header Cache-Control "no-cache";
    }
    location = /delivery-manifest.json {
        root /var/www/antigravity/agency-platform-react/dist;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/antigravity/agency-platform-react/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/antigravity_panel_access.log;
    error_log /var/log/nginx/antigravity_panel_error.log;
}
