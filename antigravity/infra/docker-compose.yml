version: '3.8'

# Los dos frontends (agency-platform-react y antigravity/frontend) NO se
# containerizan acá — se compilan con `npm run build` y su `dist/` lo sirve
# nginx directo en el host (ver infra/nginx.conf). Este compose solo levanta
# lo que sí necesita correr como proceso: base de datos, caché/cola y los
# tres servicios de Node (api, instance-manager, queue).

services:
  mysql:
    image: mysql:8.0
    container_name: ag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-antigravity}
      MYSQL_USER: ${MYSQL_USER:-antigravity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-antigravity}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "3306:3306"
    networks:
      - antigravity_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ag-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - antigravity_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: ag-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-antigravity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-antigravity}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-antigravity}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      SOCKET_SECRET: ${SOCKET_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-https://antigravity.co}
      TRAVELTIME_APP_ID: ${TRAVELTIME_APP_ID}
      TRAVELTIME_API_KEY: ${TRAVELTIME_API_KEY}
      # Pagos: Efipay es la pasarela real (manda sobre Stripe si está configurada).
      # Antes del primer despliegue correr db/migrate_efipay.js.
      EFIPAY_API_URL: ${EFIPAY_API_URL:-https://sag.efipay.co/api/v1}
      EFIPAY_ACCESS_TOKEN: ${EFIPAY_ACCESS_TOKEN}
      EFIPAY_OFFICE_ID: ${EFIPAY_OFFICE_ID}
      EFIPAY_WEBHOOK_TOKEN: ${EFIPAY_WEBHOOK_TOKEN}
      EFIPAY_CHECKOUT_TEMPLATE_ID: ${EFIPAY_CHECKOUT_TEMPLATE_ID}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://antigravity.co}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAGOS_EMULADOS: ${PAGOS_EMULADOS:-false}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:soporte@antigravity.co}
      INSTANCE_MANAGER_URL: http://instance-manager:3001
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antigravity_network
    volumes:
      - ../logs:/app/logs
    ports:
      - "3002:3002"

  instance-manager:
    build:
      context: ..
      dockerfile: Dockerfile.instance
    container_name: ag-instance-manager
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-antigravity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-antigravity}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-antigravity}
      REDIS_HOST: redis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SOCKET_SECRET: ${SOCKET_SECRET}
      API_URL: http://api:3002
      TRAVELTIME_APP_ID: ${TRAVELTIME_APP_ID}
      TRAVELTIME_API_KEY: ${TRAVELTIME_API_KEY}
      # Enlace de seguimiento que el bot manda al cliente por WhatsApp —
      # debe apuntar al dominio real de antigravity/frontend (ver nginx.conf).
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-https://panel.antigravity.co/delivery/track}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antigravity_network
    volumes:
      - ../auth_info:/app/auth_info
      - ../logs:/app/logs

  queue:
    build:
      context: ..
      dockerfile: Dockerfile.queue
    container_name: ag-queue
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-antigravity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-antigravity}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-antigravity}
      REDIS_HOST: redis
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      INSTANCE_MANAGER_URL: http://instance-manager:3001
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      instance-manager:
        condition: service_started
    networks:
      - antigravity_network
    volumes:
      - ../logs:/app/logs

volumes:
  mysql_data:
  redis_data:

networks:
  antigravity_network:
    driver: bridge
